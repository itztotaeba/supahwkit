[versions]
agp = "9.4.1"
# Kotlin: versi 2.x menyatukan Compose Compiler sebagai plugin resmi
# (org.jetbrains.kotlin.plugin.compose) -> tidak perlu lagi mengatur
# composeOptions kotlinCompilerExtensionVersion secara manual.
kotlin = "2.0.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# BOM Compose: satu versi penentu untuk SEMUA artefak androidx.compose.*
composeBom = "2024.10.01"
activityCompose = "1.9.3"

# ===== Huawei Mobile Services (HMS) Core SDK =====
# hwid = artefak Account Kit (Huawei ID). Versi 6.x adalah garis stabil yang
# direkomendasikan dokumentasi resmi (https://developer.huawei.com/consumer/en/hms/).
hmsCore = "6.11.0.300"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# ===== Jetpack Compose (versi dikendalikan BOM, tidak ditulis per-artefak) =====
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ===== Huawei Mobile Services =====
# com.huawei.hms:hwid = Account Kit. Menyediakan kelas:
#   - HuaweiIdAuthService  : signIn / silentSignIn / signOut
#   - HuaweiIdAuthParams   : konfigurasi scope (profil, email, openID, dst)
#   - HuaweiIdAuthResult   : hasil autentikasi (status + profil + token)
# Artefak ini TIDAK ada di mavenCentral/google - hanya di repo resmi Huawei
# (lihat settings.gradle.kts -> maven("https://developer.huawei.com/repo/")).
huawei-hwid = { group = "com.huawei.hms", name = "hwid", version.ref = "hmsCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlin-parcelize: menghasilkan implementasi Parcelable dari anotasi @Parcelize.
# Dipakai oleh UserProfile agar objek profil bisa dikirim antar-Activity via Intent.
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

