distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# ============================================================================
# GRADLE WRAPPER - menentukan versi Gradle yang dipakai proyek ini.
# ----------------------------------------------------------------------------
# RIWAYAT MASALAH (kenapa file ini diubah):
#   Error di Android Studio:
#     "Incompatible Gradle JVM version - Gradle 8.9 supports Java 1.8..22,
#      sedangkan Gradle JVM terpilih = Java 25"
#   Penyebab: Android Studio terbaru memakai JBR (JetBrains Runtime) 25
#   sebagai Gradle JDK default, sementara Gradle 8.9 hanya mendukung
#   sampai Java 22.
#
# DUA JALAN KELUAR (pilih salah satu, keduanya sudah disiapkan repo ini):
#   A. TETAP pakai Gradle 8.9 + AGP 8.7.3 + plugin Huawei AGConnect
#      -> wajib arahkan Gradle JDK ke Java 17. Repo ini mengunci pilihan
#         itu lewat `gradle.properties` (org.gradle.java.home).
#   B. Naik ke Gradle 9.x (dukung Java 25) -> TIDAK bisa, karena plugin
#      com.huawei.agconnect 1.9.x crash di Gradle 9 (internal API AGP lama
#      sudah dihapus). Jadi opsi A yang dipakai.
#
# CARA CEK CEPAT dari terminal (tanpa Android Studio):
#   JAVA_HOME=/path/ke/jdk17 ./gradlew assembleDebug
# ============================================================================
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
