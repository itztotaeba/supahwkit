# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.builtInKotlin=true
android.newDsl=false
android.useAndroidX=true

# ===== PENYESUAIAN TOOLCHAIN AGC (PR ini) =====
# foojay-resolver-convention 1.0.0 tidak mengenali format nomor Java baru
# ("25.0.3") yang diberikan Gradle toolchain -> IllegalArgumentException saat
# resolve JDK. Karena build Android cukup memakai JDK 17 sistem, mekanisme
# auto-download JDK dimatikan dan JAVA_HOME lokal yang dipakai.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# ============================================================================
# MENGUNCI GRADLE JDK = JAVA 17 (fix error "Incompatible Gradle JVM version")
# ----------------------------------------------------------------------------
# Masalah: Android Studio terbaru memakai JBR/Java 25 sebagai "Gradle JDK"
#   default, padahal Gradle 8.9 hanya mendukung Java 1.8 s/d 22 -> build
#   ditolak sebelum mulai: "Incompatible Gradle JVM version".
# Solusi di sisi repo: properti di bawah memaksa SEMUA proses Gradle
#   (daemon termasuk) memakai JDK 17 yang terdeteksi otomatis dari sistem,
#   tanpa peduli apa pilihan Gradle JDK di IDE.
# Catatan penting:
#   * Ganti path di bawah dengan lokasi JDK 17 milikmu bila berbeda.
#     - Linux : /usr/lib/jvm/java-17-openjdk-amd64
#     - macOS : /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
#     - Windows(C:\Program Files\Android\Android Studio\jbr juga oke jika JBR<=22)
#   * Jika kamu lebih suka mengatur lewat IDE saja, hapus komentar properti
#     ini dan set Android Studio > Settings > Build Tools > Gradle >
#     Gradle JDK = temurin-17 / jbr-17.
#   * Kenapa tidak naik ke Gradle 9 (yang mendukung Java 25)? Karena plugin
#     com.huawei.agconnect 1.9.x crash di Gradle 9 / AGP 9 (NoClassDefFoundError
#     com/android/build/api/transform/*). Kita terkunci sampai Huawei rilis
#     agconnect versi AGP-9-compatible.
# ============================================================================
# PATH JDK-mu ditulis di file TERPISAH `gradle/gradle-jdk.local.properties`
# (tidak ikut ter-commit karena tiap mesin beda). File itu digenerate oleh
# skrip `./scripts/use-jdk17.sh`. Jika belum ada, build jalan normal memakai
# Gradle JDK dari IDE.
if (fileExists("gradle/gradle-jdk.local.properties")) {
    def extra = new Properties()
    file("gradle/gradle-jdk.local.properties").withInputStream { extra.load(it) }
    extra.each { k, v -> if (k == "org.gradle.java.home") System.setProperty(k, v) }
}
# Fallback langsung (berikan komentar & isi path bila skrip tidak dipakai):
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17
