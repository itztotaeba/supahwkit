# ============================================================================
# GRADLE DAEMON JVM - mengunci versi Java yang dipakai Gradle daemon.
# ----------------------------------------------------------------------------
# LATAR BELAKANG BUG:
#   File ini tadinya berisi "toolchainVersion=25" (generate otomatis oleh
#   task `./gradlew updateDaemonJvm`). Nilai 25 membuat Gradle mencari/mengunduh
#   JDK 25 dan menjalankannya sebagai daemon, lalu bertabrakan dengan aturan
#   kompatibilitas Gradle 8.9 (maks Java 22) -> Android Studio menampilkan:
#     "Incompatible Gradle JVM version ... Gradle 8.9 supports Java 1.8-22".
# FIX:
#   Kunci ke 17 = versi paling stabil untuk kombinasi proyek ini:
#   AGP 8.7.3 + Gradle 8.9 + Kotlin 2.0.21 + plugin com.huawei.agconnect 1.9.x.
#   (Java 21 juga didukung Gradle 8.9, tapi 17 adalah rekomendasi resmi Android.)
# ============================================================================
toolchainVersion=17
